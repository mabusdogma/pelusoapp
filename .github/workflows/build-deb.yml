name: Build iOS DEB Package with Theos

on:
  push:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Preparar Web Assets y Versionar HTML
        run: |
          cat << 'EOF' > version_script.py
          import json, os

          with open('package.json', 'r') as f:
              data = json.load(f)
          version_name = data.get('version', '1.0.0')
          parts = version_name.split('.')
          version_code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          
          os.makedirs('www', exist_ok=True)
          
          source_path = 'ipad.html' if os.path.exists('ipad.html') else ('www/ipad.html' if os.path.exists('www/ipad.html') else 'www/index.html')
          target_path = 'www/index.html'
          
          with open(source_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = content.replace('__VERSION_PLACEHOLDER__', version_name)
          content = content.replace('__VERSION_CODE_PLACEHOLDER__', str(version_code))
          
          with open(target_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Versión {version_name} inyectada desde {source_path}')
          EOF
          python3 version_script.py
          rm version_script.py

      - name: Configurar Entorno Theos, Toolchain y Linker de iOS
        run: |
          sudo apt-get update && sudo apt-get install -y clang dpkg-dev make git wget libxml2-utils llvm lld

          # Limpiar instalaciones previas
          rm -rf $HOME/theos
          
          # Clonar Theos
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          
          # Limpiar y clonar SDKs oficiales de Theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

          # Configurar toolchain y el wrapper inteligente para ld usando ld64.lld (Apple Mach-O Linker)
          mkdir -p $HOME/theos/toolchain/linux/iphone/bin
          ln -sf $(which clang) $HOME/theos/toolchain/linux/iphone/bin/clang
          ln -sf $(which clang++) $HOME/theos/toolchain/linux/iphone/bin/clang++
          ln -sf $(which llvm-ar) $HOME/theos/toolchain/linux/iphone/bin/ar

          # Crear script wrapper para forzar a ld a usar el motor ld64.lld de Apple
          cat << 'EOF' > $HOME/theos/toolchain/linux/iphone/bin/ld
          #!/bin/sh
          exec ld64.lld "$@"
          EOF
          chmod +x $HOME/theos/toolchain/linux/iphone/bin/ld

          # Instalar ldid manualmente
          sudo wget -qO /usr/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 || \
          sudo wget -qO /usr/bin/ldid https://raw.githubusercontent.com/tihmstar/ldid/master/ldid || \
          sudo apt-get install -y ldid || true
          sudo chmod +x /usr/bin/ldid

          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Construir Proyecto Nativo con Theos
        run: |
          mkdir -p theos_project/Resources
          
          # Copiar assets web
          cp www/index.html theos_project/Resources/index.html
          if [ -d "www/local" ]; then
            cp -r www/local theos_project/Resources/
          fi
          if [ -d "local" ]; then
            cp -r local theos_project/Resources/
          fi
          
          # Copiar icono si existe
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png theos_project/Resources/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png theos_project/Resources/icon.png
          fi

          cd theos_project

          # 1. Makefile de Theos con flags de desactivación de módulos e ignorar advertencias de UIWebView
          cat << 'EOF' > Makefile
          THEOS_DEVICE_IP = localhost
          ARCHS = arm64
          TARGET = iphone:clang:latest:12.0

          APPLICATION_NAME = PelusoApp
          PelusoApp_FILES = main.mm
          PelusoApp_FRAMEWORKS = UIKit Foundation
          
          # Desactivar módulos de Clang y evitar que UIWebView detenga la compilación
          ADDITIONAL_CFLAGS = -fno-modules -fno-implicit-modules -Wno-error=deprecated-declarations
          ADDITIONAL_OBJCFLAGS = -fno-modules -fno-implicit-modules -Wno-error=deprecated-declarations

          include $(THEOS)/makefiles/common.mk
          include $(THEOS)/makefiles/application.mk
          EOF

          # 2. Archivo control de Debian
          cat << 'EOF' > control
          Package: com.peluso.ipadapp
          Name: PelusoApp
          Version: 2.0.9
          Architecture: iphoneos-arm
          Description: PelusoApp Home Assistant Dashboard for iOS 12
          Maintainer: Peluso <admin@peluso.local>
          Author: Peluso
          Section: Utilities
          Depends: mobilesubstrate, uikittools
          EOF

          # 3. Info.plist para iOS 12 y Activator
          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.peluso.ipadapp</string>
              <key>CFBundleName</key>
              <string>PelusoApp</string>
              <key>CFBundleDisplayName</key>
              <string>PelusoApp</string>
              <key>CFBundleExecutable</key>
              <string>PelusoApp</string>
              <key>CFBundleVersion</key>
              <string>2.0.9</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.9</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          # 4. Código fuente Objective-C
          cat << 'EOF' > main.mm
          #import <UIKit/UIKit.h>

          @interface AppViewController : UIViewController
          @end

          @implementation AppViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              UIWebView *webView = [[UIWebView alloc] initWithFrame:self.view.bounds];
              webView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              webView.scalesPageToFit = YES;
              
              NSString *path = [[NSBundle mainBundle] pathForResource:@"index" ofType:@"html"];
              if (!path) {
                  path = `/Applications/PelusoApp.app/index.html`;
              }
              NSURL *url = [NSURL fileURLWithPath:path];
              [webView loadRequest:[NSURLRequest requestWithURL:url]];
              [self.view addSubview:webView];
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              AppViewController *vc = [[AppViewController alloc] init];
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          # Compilar el paquete .deb
          make package

          # Copiar el resultado a la raíz
          cp packages/*.deb ../pelusoapp-ios.deb
          cd ..

      - name: Upload Artifact DEB
        uses: actions/upload-artifact@v4
        with:
          name: pelusoapp-ios
          path: pelusoapp-ios.deb

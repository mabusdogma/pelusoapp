name: Build iOS DEB Package

on:
  push:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Preparar Web Assets y Versionar HTML
        run: |
          cat << 'EOF' > version_script.py
          import json, os

          with open('package.json', 'r') as f:
              data = json.load(f)
          version_name = data.get('version', '1.0.0')
          parts = version_name.split('.')
          version_code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          
          os.makedirs('www', exist_ok=True)
          
          source_path = 'ipad.html' if os.path.exists('ipad.html') else ('www/ipad.html' if os.path.exists('www/ipad.html') else 'www/index.html')
          target_path = 'www/index.html'
          
          with open(source_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = content.replace('__VERSION_PLACEHOLDER__', version_name)
          content = content.replace('__VERSION_CODE_PLACEHOLDER__', str(version_code))
          
          with open(target_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Versión {version_name} inyectada desde {source_path}')
          EOF
          python3 version_script.py
          rm version_script.py

      - name: Compilar Binario Mach-O con Zig (Sin libSystem)
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/Applications/PelusoApp.app

          # Copiar assets web generados y recursos locales dentro de la App
          cp www/index.html deb_package/Applications/PelusoApp.app/
          if [ -d "www/local" ]; then
            cp -r www/local deb_package/Applications/PelusoApp.app/
          fi
          if [ -d "local" ]; then
            cp -r local deb_package/Applications/PelusoApp.app/
          fi

          # Copiar icono si existe
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png deb_package/Applications/PelusoApp.app/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png deb_package/Applications/PelusoApp.app/icon.png
          fi

          # Descargar Zig 0.13.0 oficialmente
          ZIG_VERSION="0.13.0"
          echo ">>> Descargando Zig $ZIG_VERSION... <<<"
          curl -L https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz -o zig.tar.xz
          tar -xf zig.tar.xz
          ZIG_BIN="$PWD/zig-linux-x86_64-$ZIG_VERSION/zig"

          # Crear código fuente minimalista para arm64 sin dependencias
          cat << 'EOF' > main.c
          void _start() {
              // Llamada directa al kernel para finalizar ejecución de manera limpia
              __asm__("mov x0, #0\n\tmov x16, #1\n\tsvc #0x80");
          }
          EOF

          # Compilar especificando formato Mach-O y freestanding (Evita por completo la búsqueda de libSystem)
          "$ZIG_BIN" cc -target aarch64-ios -ofmt=macho -nostdlib -ffreestanding main.c -o deb_package/Applications/PelusoApp.app/PelusoApp
          chmod +x deb_package/Applications/PelusoApp.app/PelusoApp
          rm main.c zig.tar.xz

          # Crear archivo de control DEBIAN para ubicarlo en /Applications y requerir uicache
          cat << 'EOF' > deb_package/DEBIAN/control
          Package: com.peluso.ipadapp
          Name: PelusoApp
          Version: 2.0.9
          Architecture: iphoneos-arm
          Description: PelusoApp Home Assistant Dashboard for iOS 12
          Maintainer: Peluso <admin@peluso.local>
          Author: Peluso
          Section: Utilities
          Depends: mobilesubstrate, uikittools
          EOF

          # Crear script postinst para actualizar el uicache del SpringBoard
          cat << 'EOF' > deb_package/DEBIAN/postinst
          #!/bin/sh
          chmod 755 /Applications/PelusoApp.app/PelusoApp
          uicache
          exit 0
          EOF
          chmod +x deb_package/DEBIAN/postinst

          # Crear Info.plist completo compatible con iOS 12 y Activator
          cat << 'EOF' > deb_package/Applications/PelusoApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.peluso.ipadapp</string>
              <key>CFBundleName</key>
              <string>PelusoApp</string>
              <key>CFBundleDisplayName</key>
              <string>PelusoApp</string>
              <key>CFBundleExecutable</key>
              <string>PelusoApp</string>
              <key>CFBundleVersion</key>
              <string>2.0.9</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.9</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>12.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          # Ajustar permisos estrictos requeridos por dpkg
          find deb_package -type d -exec chmod 755 {} +
          chmod 644 deb_package/DEBIAN/control
          chmod 755 deb_package/DEBIAN/postinst
          chmod 755 deb_package/Applications/PelusoApp.app/PelusoApp

      - name: Compilar Paquete .deb con Gzip Compatible
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          dpkg-deb -Zgzip --build deb_package pelusoapp-ios.deb

      - name: Upload Artifact DEB
        uses: actions/upload-artifact@v4
        with:
          name: pelusoapp-ios
          path: pelusoapp-ios.deb

name: Build iOS DEB Package

on:
  push:
    branches: [ main ]

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Preparar Web Assets y Versionar HTML
        run: |
          cat << 'EOF' > version_script.py
          import json, os

          with open('package.json', 'r') as f:
              data = json.load(f)
          version_name = data.get('version', '1.0.0')
          parts = version_name.split('.')
          version_code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          
          os.makedirs('www', exist_ok=True)
          
          source_path = 'ipad.html' if os.path.exists('ipad.html') else ('www/ipad.html' if os.path.exists('www/ipad.html') else 'www/index.html')
          target_path = 'www/index.html'
          
          with open(source_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = content.replace('__VERSION_PLACEHOLDER__', version_name)
          content = content.replace('__VERSION_CODE_PLACEHOLDER__', str(version_code))
          
          with open(target_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Versión {version_name} inyectada desde {source_path}')
          EOF
          python3 version_script.py
          rm version_script.py

      - name: Crear Estructura Web Clip para iOS 12
        run: |
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/var/mobile/Library/WebClips/PelusoApp.webclip

          # Copiar el icono si existe en la raíz o assets
          if [ -f "assets/icon.png" ]; then
            cp assets/icon.png deb_package/var/mobile/Library/WebClips/PelusoApp.webclip/icon.png
          elif [ -f "icon.png" ]; then
            cp icon.png deb_package/var/mobile/Library/WebClips/PelusoApp.webclip/icon.png
          fi

          # Crear el Info.plist nativo del Web Clip (Apunta a tu Home Assistant o servidor local)
          cat << 'EOF' > deb_package/var/mobile/Library/WebClips/PelusoApp.webclip/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>URL</key>
              <string>http://192.168.1.100:8123</string>
              <key>Title</key>
              <string>PelusoApp</string>
              <key>FullScreen</key>
              <true/>
              <key>IsApp</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Crear archivo de control DEBIAN
          cat << 'EOF' > deb_package/DEBIAN/control
          Package: com.peluso.ipadapp
          Name: PelusoApp
          Version: 2.0.9
          Architecture: iphoneos-arm
          Description: PelusoApp Home Assistant Dashboard for iOS 12
          Maintainer: Peluso <admin@peluso.local>
          Author: Peluso
          Section: Utilities
          Depends: uikittools
          EOF

          # Crear script postinst para ajustar permisos de usuario móvil y refrescar uicache
          cat << 'EOF' > deb_package/DEBIAN/postinst
          #!/bin/sh
          chown -R 501:501 /var/mobile/Library/WebClips/PelusoApp.webclip
          chmod 755 /var/mobile/Library/WebClips/PelusoApp.webclip
          uicache
          exit 0
          EOF
          chmod +x deb_package/DEBIAN/postinst

          # Ajustar permisos generales del paquete
          find deb_package -type d -exec chmod 755 {} +
          chmod 644 deb_package/DEBIAN/control
          chmod 755 deb_package/DEBIAN/postinst

      - name: Compilar Paquete .deb con Gzip Compatible
        run: |
          dpkg-deb -Zgzip --build deb_package pelusoapp-ios.deb

      - name: Upload Artifact DEB
        uses: actions/upload-artifact@v4
        with:
          name: pelusoapp-ios
          path: pelusoapp-ios.deb

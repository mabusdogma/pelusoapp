name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Preparar Web Assets y Versionar HTML
        run: |
          python3 -c "
          import json, os
          with open('package.json', 'r') as f:
              data = json.load(f)
          version_name = data.get('version', '1.0.0')
          parts = version_name.split('.')
          version_code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])
          
          os.makedirs('www', exist_ok=True)
          
          source_path = 'ipad.html' if os.path.exists('ipad.html') else ('www/ipad.html' if os.path.exists('www/ipad.html') else 'www/index.html')
          target_path = 'www/index.html'
          
          with open(source_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = content.replace('__VERSION_PLACEHOLDER__', version_name)
          content = content.replace('__VERSION_CODE_PLACEHOLDER__', str(version_code))
          
          with open(target_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Versión {version_name} inyectada desde {source_path}')
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Habilitar Depuración WebView en MainActivity (Robusto)
        run: |
          python3 -c "
          import glob
          main_files = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          print('Archivos MainActivity encontrados:', main_files)
          if main_files:
              path = main_files[0]
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              
              print('--- CONTENIDO ORIGINAL DE MAINACTIVITY ---')
              print(content)
              print('-----------------------------------------')

              if 'setWebContentsDebuggingEnabled' not in content:
                  if 'import android.webkit.WebView;' not in content:
                      content = content.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport android.webkit.WebView;')
                  
                  # Inyección segura después de la superclase onCreate
                  target_str = 'super.onCreate(savedInstanceState);'
                  if target_str in content:
                      replacement = target_str + '\n        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.KITKAT) {\n            WebView.setWebContentsDebuggingEnabled(true);\n        }'
                      content = content.replace(target_str, replacement, 1)
                  
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print('>>> Depuración de WebView inyectada correctamente en MainActivity.java <<<')
              else:
                  print('>>> La depuración ya estaba habilitada <<<')
          "

      - name: Configure Android Manifest and FileProvider automatically
        run: |
          mkdir -p android/app/src/main/res/xml
          
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cached_files" path="." />
              <external-cache-path name="external_cached_files" path="." />
          </paths>
          EOF

          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          if 'REQUEST_INSTALL_PACKAGES' not in content:
              permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />
              '''
              content = content.replace('<application', permissions + '\n<application')

          if 'usesCleartextTraffic' not in content:
              content = content.replace('<application', '<application android:usesCleartextTraffic=\"true\"')

          if 'fileprovider' not in content:
              provider = '''
                  <provider
                      android:name=\"androidx.core.content.FileProvider\"
                      android:authorities=\"${applicationId}.fileprovider\"
                      android:exported=\"false\"
                      android:grantUriPermissions=\"true\">
                      <meta-data
                          android:name=\"android.support.FILE_PROVIDER_PATHS\"
                          android:resource=\"@xml/file_paths\" />
                  </provider>
              '''
              content = content.replace('<application', '<application\n' + provider)

          with open(manifest_path, 'w') as f:
              f.write(content)
          "

      - name: Generate App Icons and Splash
        run: |
          npx --yes capacitor-assets generate --android

      - name: Actualizar version en Gradle desde package.json
        run: |
          python3 -c "
          import json, re
          with open('package.json', 'r') as f:
              data = json.load(f)
          version_name = data.get('version', '1.0.0')
          parts = version_name.split('.')
          version_code = int(parts[0]) * 10000 + int(parts[1]) * 100 + int(parts[2])

          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              content = f.read()

          content = re.sub(r'versionCode \d+', f'versionCode {version_code}', content)
          content = re.sub(r'versionName \".*?\"', f'versionName \"{version_name}\"', content)

          with open(gradle_path, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Decode Keystore from Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Build Unsigned Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK with Keystore
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/keystore.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            android/app/build/outputs/apk/release/app-release-unsigned.apk || \
          $BUILD_TOOLS/apksigner sign \
            --ks android/app/keystore.jks \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/app-release.apk

      - name: Preparar Archivo APK Fijo
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pelusoapp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: actualizacion-app
          path: |
            pelusoapp.apk
